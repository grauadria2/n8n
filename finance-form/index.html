<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finance Tracker</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f4f6f8;
  padding:20px;
}

.container{
  max-width:400px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

h2{
  text-align:center;
  margin-bottom:20px;
}

label{
  font-weight:bold;
  margin-top:10px;
  display:block;
}

select,input{
  width:100%;
  padding:10px;
  margin-top:5px;
  margin-bottom:15px;
  border-radius:6px;
  border:1px solid #ccc;
}

button{
  width:100%;
  padding:12px;
  background:#4CAF50;
  color:white;
  border:none;
  border-radius:6px;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  background:#43a047;
}
</style>

</head>

<body>

<div class="container">

<h2>New Transaction</h2>

<form method="POST" action="TU_WEBHOOK_N8N">

<label>Date</label>
<input type="date" name="date_time" required>

<label>Type</label>
<select name="type">
<option value="expense">expense</option>
<option value="income">income</option>
</select>

<label>Account</label>
<select name="account">
<option value="Revolut">Revolut</option>
<option value="Imagin">Imagin</option>
<option value="Cash">Cash</option>
</select>

<label>Category</label>
<select id="category" name="category" onchange="updateSubcategory()" required>
<option value="">Select category</option>
<option value="Income">Income</option>
<option value="Housing">Housing</option>
<option value="Food">Food</option>
<option value="Transport">Transport</option>
<option value="Lifestyle">Lifestyle</option>
<option value="Travel">Travel</option>
<option value="Health">Health</option>
<option value="Subscriptions">Subscriptions</option>
<option value="Shopping">Shopping</option>
</select>

<label>Sub Category</label>
<select id="subcategory" name="sub_category" required></select>

<label>Description</label>
<input type="text" name="description">

<label>Amount</label>
<input type="number" step="0.01" name="amount" required>

<button type="submit">Save Transaction</button>

</form>

</div>

<script>

const subcategories = {

Income: [
"salary",
"bonus",
"refund",
"other_income"
],

Housing: [
"rent",
"electricity",
"water",
"internet",
"home_supplies"
],

Food: [
"groceries",
"restaurant",
"coffee",
"delivery"
],

Transport: [
"metro",
"train",
"fuel",
"taxi",
"parking"
],

Lifestyle: [
"gym",
"clothing",
"entertainment",
"hobbies"
],

Travel: [
"flight",
"accommodation",
"activities",
"transport"
],

Health: [
"pharmacy",
"doctor",
"insurance"
],

Subscriptions: [
"streaming",
"music",
"software",
"cloud"
],

Shopping: [
"electronics",
"home_items",
"gifts",
"other_shopping"
]

};

function updateSubcategory(){

const category = document.getElementById("category").value;
const subSelect = document.getElementById("subcategory");

subSelect.innerHTML="";

if(!subcategories[category]) return;

subcategories[category].forEach(function(sub){

let option=document.createElement("option");
option.value=sub;
option.text=sub;

subSelect.appendChild(option);

});

}

</script>

</body>
</html>
